openapi: 3.1.0
info:
  title: Sahel 2.0 API
  version: 0.1.0
  description: |
    The single API used by BOTH the Next.js web app and the Flutter mobile app, so data and
    pricing are identical on every channel. Currently served by Next.js route handlers
    (apps/web/app/api/v1); the contract stays the same when it moves to a dedicated service.

    Conventions:
    - Money is always integer **fils** (1 BHD = 1000 fils). Field names end in `Fils`.
    - Success: `{ "data": ... }`. Error: `{ "error": { "code", "message" } }`.
    - Localized text is `{ "en": "...", "ar": "..." }`.
    - ⚠️ Sandbox customer session (stand-in for eKey / OIDC login): the web carries an opaque random id in the
      HttpOnly, SameSite=Lax cookie `sahel_session`; the mobile app sends `X-Sahel-Session: new` until the API
      returns its id in the `X-Sahel-Session` response header, then sends that id on every request. Unknown or
      expired ids get a new session. Each session starts as the demo customer; completing onboarding
      (POST /onboarding/pre-approval) switches it to that customer's own financials and pre-approval.
      Applications, issued cards, pre-approval share tokens, payments and idempotency keys belong to the session's
      customer: another session gets 404 for them.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /vehicles:
    get:
      summary: Search vehicles (with "from BHD X / month" on each listing)
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: condition, in: query, schema: {enum: [new, used]}}
        - {name: bodyType, in: query, schema: {enum: [sedan, suv, hatchback, pickup, coupe]}}
        - {name: fuel, in: query, schema: {enum: [petrol, hybrid, electric]}}
        - {name: make, in: query, schema: {type: string}}
        - {name: maxPriceFils, in: query, schema: {type: integer}}
        - {name: maxMonthlyFils, in: query, schema: {type: integer}}
        - {name: structure, in: query, schema: {$ref: '#/components/schemas/FinanceStructure'}}
        - {name: sort, in: query, schema: {enum: [price-asc, price-desc, year-desc, mileage-asc]}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/VehicleListing'}}
                      total: {type: integer}
  /vehicles/{id}:
    get:
      summary: Vehicle detail
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/VehicleListing'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /properties:
    get:
      summary: Search properties
      parameters:
        - {name: purpose, in: query, schema: {enum: [sale, rent]}}
        - {name: type, in: query, schema: {enum: [villa, apartment, townhouse, land, office]}}
        - {name: minBedrooms, in: query, schema: {type: integer}}
        - {name: maxPriceFils, in: query, schema: {type: integer}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/PropertyListing'}}
                      total: {type: integer}
  /properties/{id}:
    get:
      summary: Property detail
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/PropertyListing'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /cards:
    get:
      summary: IMTIAZ card products, each with the session customer's eligibility (same rules as card apply)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CardOffer'}},
                      total: {type: integer}}}}}}}}
  /quotes/finance:
    post:
      summary: Finance quote. Omit `structure` to get every offered structure side by side. Omit `downPaymentFils` or `tenureMonths` to quote the listing defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productLine, assetPriceFils]
              properties:
                productLine: {enum: [vehicle, personal, home]}
                assetPriceFils: {type: integer, minimum: 1}
                downPaymentFils: {type: integer, minimum: 0, description: Defaults to limits.defaultDownPaymentFils}
                tenureMonths: {type: integer, description: Defaults to limits.defaultTenureMonths}
                structure: {$ref: '#/components/schemas/FinanceStructure'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      quotes: {type: array, items: {$ref: '#/components/schemas/FinanceQuote'}}
                      limits: {$ref: '#/components/schemas/FinanceLimits'}
        '400': {$ref: '#/components/responses/Error'}
        '422':
          description: Business rule violated (STRUCTURE_NOT_OFFERED, TENURE_OUT_OF_RANGE, DOWN_PAYMENT_TOO_LOW, DOWN_PAYMENT_TOO_HIGH, INVALID_AMOUNT)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /insurance/motor-quotes:
    post:
      summary: Motor insurance comparison (sorted by premium)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleValueFils]
              properties:
                vehicleValueFils: {type: integer, minimum: 1}
                cover: {enum: [comprehensive, third-party], default: comprehensive}
                takafulOnly: {type: boolean}
                agencyRepair: {type: boolean}
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/Error'}
  /me:
    get:
      summary: |
        The session customer (pre-approval, contracts, garage). The demo customer until onboarding completes, then
        their own name, salary, obligations and pre-approval (⚠️ contracts, garage and rewards stay demo data).
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/CustomerView'}}}}}}
  /payments:
    post:
      summary: Create a payment (sandbox; production wraps Tap Payments server-side). Idempotency keys are scoped to the customer session.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountFils, method, purpose, reference]
              properties:
                amountFils: {type: integer, minimum: 1}
                method: {enum: [card, click_to_pay, apple_pay, google_pay, samsung_pay, benefitpay]}
                purpose: {enum: [reservation_deposit, installment, insurance_premium, early_settlement, valuation_fee]}
                reference: {type: string}
      responses:
        '201': {description: 'Created (status INITIATED, with nextAction)'}
        '400': {description: 'Missing Idempotency-Key, or a body that is not a JSON object', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'PAYMENT_INVALID; AMOUNT_MISMATCH (server-priced purpose with another amount; nothing is created)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}},
          $ref: '#/components/responses/Error'}
        '404': {description: 'UNKNOWN_REFERENCE (deposit or valuation fee for a vehicle / property not in the catalog)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
      description: |
        Server-side amount binding: for `reservation_deposit` (reference = a catalog vehicle id) and `valuation_fee`
        (reference = a property for sale) the server decides the amount (GET /payments/price). Any other amount is
        rejected with 422 AMOUNT_MISMATCH before a charge is created; an unknown reference is 404 UNKNOWN_REFERENCE.
  /payments/{id}/confirm:
    post:
      summary: Sandbox stand-in for "customer completed the Tap flow and the webhook verified it". Only the session that created the payment can confirm it.
      description: |
        An `early_settlement` payment is checked BEFORE it is captured: its reference must be `{contractId}-settle` for one of
        the session customer's contracts, and its amount must equal that contract's current settlement quote to the fils.
        A wrong payment is rejected and stays uncaptured. Once CAPTURED, the contract is settled for this customer
        (GET /me shows `settlement`, outstandingFils 0 and no next installment). Confirming again returns the same payment.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK (status CAPTURED)}
        '404': {description: "PAYMENT_NOT_FOUND (unknown id, or another session's payment); CONTRACT_NOT_FOUND (early settlement for an unknown contract)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'INVALID_TRANSITION (the payment can no longer be captured, e.g. FAILED or VOIDED); ALREADY_SETTLED (the contract was settled by another payment)', content: {
              application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'AMOUNT_MISMATCH (early settlement amount differs from the current quote; nothing is captured)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/preapproval-token:
    post:
      summary: Share my pre-approval with a dealer. Returns a short-lived (15 min), random, opaque token to show as text or QR.
      description: |
        The dealer redeems the token for first name, vehicle limit, max monthly and validity only
        (never salary, CPR or obligations). Demo customer until eKey login exists.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/PreApprovalShare'}}}
        '422': {description: NO_PREAPPROVAL (no vehicle headroom to share), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dealer/preapproval/redeem:
    post:
      summary: "Dealer portal: redeem a customer's pre-approval token for the minimal summary"
      description: ⚠️ Sandbox has no staff login; production requires a partner-SSO bearer token whose seller matches `sellerId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerId, token]
              properties:
                sellerId: {type: string, description: 'nmc, tac or demo-dealer'}
                token: {type: string, description: Case-insensitive; spaces and dashes are ignored}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/SharedPreApproval'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {description: TOKEN_NOT_FOUND or UNKNOWN_DEALER, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: TOKEN_EXPIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dealer/{sellerId}/inventory:
    get:
      summary: "Dealer portal: the dealer's vehicles with monthly prices (conventional and Murabaha) and stock stats"
      parameters: [$ref: '#/components/parameters/SellerId']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      seller: {type: object}
                      items:
                        type: array
                        items:
                          allOf:
                            - {$ref: '#/components/schemas/VehicleListing'}
                            - {type: object, properties: {fromMonthlyMurabahaFils: {type: integer}}}
                      stats:
                        type: object
                        properties:
                          count: {type: integer}
                          newCount: {type: integer}
                          usedCount: {type: integer}
                          avgPriceFils: {type: integer}
                          totalValueFils: {type: integer}
        '404': {$ref: '#/components/responses/Error'}
  /dealer/{sellerId}/leads:
    get:
      summary: "Dealer portal: leads (customers who reserved, applied for, or viewed a car), newest first, with pipeline counts"
      parameters: [$ref: '#/components/parameters/SellerId']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Lead'}}
                      total: {type: integer}
                      stats:
                        type: object
                        properties:
                          total: {type: integer}
                          open: {type: integer}
                          won: {type: integer}
                          lost: {type: integer}
                          byStatus: {type: object, additionalProperties: {type: integer}}
        '404': {$ref: '#/components/responses/Error'}
  /dealer/{sellerId}/leads/{leadId}:
    parameters:
      - {$ref: '#/components/parameters/SellerId'}
      - {name: leadId, in: path, required: true, schema: {type: string}}
    get:
      summary: "Dealer portal: one lead"
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Lead'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      summary: "Dealer portal: move a lead along NEW → CONTACTED → TEST_DRIVE → OFFER_SENT → WON / LOST"
      description: Allowed moves are NEW→CONTACTED|LOST, CONTACTED→TEST_DRIVE|OFFER_SENT|LOST, TEST_DRIVE→OFFER_SENT|LOST, OFFER_SENT→WON|LOST. WON and LOST are final.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/LeadStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Lead'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {description: LEAD_NOT_FOUND (also for another dealer's lead), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: INVALID_TRANSITION, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dealer/offers:
    post:
      summary: "Dealer portal: price a car for a customer who shared their pre-approval, every structure side by side, checked against the shared limit"
      description: |
        The token is re-checked on every call, so an expired share cannot be priced.
        A quote is within the limit when financedFils <= vehicleLimitFils and monthlyFils <= maxMonthlyFils.
        ⚠️ Sandbox: the offer is not yet pushed to the customer's app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerId, token, vehicleId, downPaymentFils, tenureMonths]
              properties:
                sellerId: {type: string}
                token: {type: string}
                vehicleId: {type: string, description: Must be in this dealer's inventory}
                downPaymentFils: {type: integer, minimum: 0}
                tenureMonths: {type: integer}
                structures: {type: array, items: {$ref: '#/components/schemas/FinanceStructure'}, description: Defaults to every structure offered for vehicles}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sellerId: {type: string}
                      vehicle: {$ref: '#/components/schemas/VehicleListing'}
                      customer: {$ref: '#/components/schemas/SharedPreApproval'}
                      quotes:
                        type: array
                        items:
                          allOf:
                            - {$ref: '#/components/schemas/FinanceQuote'}
                            - type: object
                              properties:
                                withinFinanceLimit: {type: boolean}
                                withinMonthlyLimit: {type: boolean}
                                withinLimit: {type: boolean}
                      withinLimit: {type: boolean, description: At least one structure fits}
                      createdAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '404': {description: 'TOKEN_NOT_FOUND, VEHICLE_NOT_FOUND or UNKNOWN_DEALER', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: TOKEN_EXPIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'VEHICLE_NOT_IN_INVENTORY or a quote rule (DOWN_PAYMENT_TOO_LOW, TENURE_OUT_OF_RANGE, STRUCTURE_NOT_OFFERED, ...)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /onboarding/ekey:
    post:
      summary: "Log in with eKey (SANDBOX, simulated): any valid 9-digit CPR returns a fictional verified identity, kept in the customer session. Only the masked CPR is returned or stored"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpr]
              properties:
                cpr: {type: string, pattern: '^\d{9}$'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/EKeyIdentity'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '422':
          description: INVALID_CPR (not exactly 9 digits)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /onboarding/pre-approval:
    post:
      summary: "Live pre-approval at the end of onboarding (journey J1). Records the consent (valid 90 days) and returns indicative limits. The session keeps these financials and the pre-approval for /me,
        cards and applications. SANDBOX: no CRB or Open Banking call"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlySalaryFils, consentScopes]
              properties:
                monthlySalaryFils: {type: integer, minimum: 1}
                existingObligationsFils: {type: integer, minimum: 0, default: 0}
                employer: {type: string, maxLength: 120}
                consentScopes:
                  type: array
                  description: Both scopes are required
                  items: {$ref: '#/components/schemas/ConsentScope'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/OnboardingPreApproval'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '422':
          description: CONSENT_REQUIRED (missing or partial consent), CONSENT_EXPIRED, INVALID_SALARY, INVALID_OBLIGATIONS
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /cards/{id}/apply:
    post:
      summary: "Instant IMTIAZ card application (journey J3, SANDBOX). APPROVED issues a virtual card with a masked number (never a full PAN or CVV); DECLINED gives a reason. Both return 200"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        description: Optional. The decision always uses the session customer's financials (from onboarding, else the demo customer's); salary and obligations in the body are rejected with 400
        content:
          application/json:
            schema:
              type: object
              properties:
                requestedLimitFils: {type: integer, minimum: 1, description: Capped at the pre-approved card limit}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/CardApplication'}}}}}}
        '400': {description: 'BAD_REQUEST (salary or obligations sent, or a bad requestedLimitFils), BAD_JSON', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404':
          description: CARD_NOT_FOUND
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/cards:
    get:
      summary: Virtual cards issued to the session customer (in-memory sandbox; masked numbers only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/VirtualCard'}}
                      total: {type: integer}
  /applications:
    get:
      summary: The session customer's finance applications, newest first (sandbox store, in memory)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/FinanceApplication'}}
                      total: {type: integer}
    post:
      summary: |
        Apply for vehicle, personal or home finance (sandbox). Creates, submits and decides immediately against the
        session customer's financials (their own after onboarding, else the demo customer's; settled contracts no longer
        count as obligations) and their pre-approval limit for the product line. The vehicle and property prices
        come from the catalog, never from the client. Structures per line come from the rate card: vehicle and personal
        (conventional, murabaha), home (conventional, ijara). A repeated Idempotency-Key from the same customer returns
        the original application; keys are scoped to the customer.

        A vehicle application can carry a won Bid For Me bid (`requestId` + `bidId`) and the customer's trade-in
        (`useTradeIn: true`). Neither is trusted: the server checks that the request belongs to the session customer,
        is CLOSED with this bid accepted, the bid is for this car at its current price and is still held (7 days after
        acceptance), and then prices the application at the bid's discounted price (never a client price). The
        extras are recorded on the application. With `useTradeIn` the server takes the customer's active unexpired
        offer, counts min(offer, maximum down payment) in the down payment (the customer can add cash on top, but
        the down payment is never below the credit) and records it as a credit given at delivery. The response's
        `pricing` shows the breakdown. Without them the application is priced exactly as before.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productLine, structure, tenureMonths]
              properties:
                productLine: {enum: [vehicle, personal, home]}
                structure: {enum: [conventional, murabaha, ijara]}
                tenureMonths: {type: integer}
                vehicleId: {type: string, description: Required for vehicle}
                downPaymentFils: {type: integer, minimum: 0, default: 0, description: Vehicle and home}
                amountFils: {type: integer, minimum: 500000, description: Required for personal}
                propertyId: {type: string, description: 'Required for home (a property for sale; the price comes from the catalog)'}
                requestId: {type: string, description: 'Vehicle only, with bidId: the customer''s Bid For Me request whose accepted bid prices the application'}
                bidId: {type: string, description: 'Vehicle only, with requestId: the accepted bid'}
                useTradeIn: {type: boolean, description: 'Vehicle only: count the customer''s active trade-in offer in the down payment (credited at delivery)'}
      responses:
        '201': {description: Created and decided, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/FinanceApplication'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {description: 'Unknown vehicleId or propertyId, or BID_NOT_FOUND (no such request or bid for this customer)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'BID_NOT_ACCEPTED: the request is not CLOSED with this bid accepted', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: 'BID_EXPIRED (the accepted bid is no longer held) or TRADE_IN_EXPIRED (the trade-in offer has expired)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422':
          description: 'Invalid terms (INVALID_REQUEST: e.g. a structure the line does not offer, a property for rent, or a bid or trade-in on a non-vehicle application; BID_VEHICLE_MISMATCH: the bid is for another car or the price changed; NO_TRADE_IN or TRADE_IN_MISMATCH: no such active offer; or a quote rule such as TENURE_OUT_OF_RANGE, DOWN_PAYMENT_TOO_LOW)'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /applications/{id}:
    get:
      summary: Application status, decision, offer and timeline. Another customer's application is 404
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/FinanceApplication'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /applications/{id}/accept:
    post:
      summary: |
        Accept the offer and e-sign (sandbox). Then runs fulfilment in order as far as it can go, recording each step in the timeline.
        Conventional: OFFER_ACCEPTED, CONTRACT_SIGNED, DISBURSED, COMPLETED.
        Murabaha: OFFER_ACCEPTED, CONTRACT_SIGNED, ASSET_PURCHASED_BY_BCFC, OWNERSHIP_TRANSFERRED_TO_BCFC,
        SALE_TO_CUSTOMER, (personal only: DISBURSED), COMPLETED. BCFC always owns the asset before selling it (Shari'a).
        Home, Ijara: OFFER_ACCEPTED, CONTRACT_SIGNED, ASSET_PURCHASED_BY_BCFC, LEASE_STARTED, then stops; OWNERSHIP_TRANSFERRED_TO_CUSTOMER
        (after the final rental) and COMPLETED stay steps to come. BCFC always owns the home before leasing it.
        Home, conventional: OFFER_ACCEPTED, CONTRACT_SIGNED, then VALUATION_CONFIRMED, DISBURSED, COMPLETED only once this customer
        has a CAPTURED valuation_fee payment for the property (until then `nextAction` is PAY_VALUATION_FEE).
        Accepting an accepted application again continues from where it stopped; a COMPLETED one is returned unchanged.
        Only the customer who applied can accept (others get 404).
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: 'OK (COMPLETED, or the last step it could reach: LEASE_STARTED for Ijara, CONTRACT_SIGNED for conventional home finance without a valuation)', content: {application/json: {
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/FinanceApplication'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: NOT_APPROVED (only APPROVED offers can be accepted) or INVALID_TRANSITION, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /life-events:
    get:
      summary: Curated life events for the Life-Event Engine (rules-based, not AI)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/LifeEvent'}}
                      total: {type: integer}
  /life-events/{id}/bundle:
    get:
      summary: |
        The bundle for a life event, priced with the pricing engine and checked against the session customer's
        DBR headroom (maxMonthlyFils): their own financials after onboarding, otherwise the demo customer's. Deterministic. ⚠️ Illustrative products, amounts and placeholder premiums.
      parameters:
        - {name: id, in: path, required: true, schema: {enum: [married, new-job, first-home, new-baby]}}
        - name: structure
          in: query
          description: 'Whole-bundle toggle: islamic uses Murabaha (vehicle, personal) and Ijara (home); conventional uses loans'
          schema: {enum: [islamic, conventional], default: islamic}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/LifeEventBundle'}}}}}}
        '404': {description: EVENT_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: INVALID_STRUCTURE, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/contracts/{id}:
    patch:
      summary: Turn autopay on or off for one of the session customer's contracts (⚠️ sandbox, in memory; reflected in this session's GET /me only)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autopay]
              properties:
                autopay: {type: boolean}
      responses:
        '200': {description: The updated contract, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Contract'}}}}}}
        '400': {description: 'BAD_JSON (body is not a JSON object)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: CONTRACT_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: ALREADY_SETTLED (a settled contract has no autopay), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'INVALID_REQUEST (autopay must be a boolean)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/contracts/{id}/settlement-quote:
    get:
      summary: |
        Early-settlement quote, as of the last paid installment. Conventional: remaining principal from the amortization
        schedule plus a placeholder fee. Murabaha: remaining sale price minus an Ibra' rebate (never "interest").
        ⚠️ Placeholder rules pending the Shari'a board and CBB. Pay it with POST /payments (purpose early_settlement,
        amountFils and reference from the quote's payment object).
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/SettlementQuote'}}}}}}
        '404': {description: CONTRACT_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'NOTHING_TO_SETTLE (fully paid), ALREADY_SETTLED (settled early)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /insurance/travel-quotes:
    post:
      summary: |
        Travel insurance comparison, cheapest first (⚠️ demo insurers, illustrative prices).
        Premium = daily rate for the region × days × (adults + children / 2), × the Plus percentage, never below
        the insurer's minimum. Dates are Bahrain calendar dates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, startDate, endDate]
              properties:
                region: {$ref: '#/components/schemas/TravelRegion'}
                tier: {enum: [basic, plus], default: basic}
                startDate: {type: string, format: date, description: 'Today or later, within 365 days'}
                endDate: {type: string, format: date, description: 'On or after startDate; at most 180 days in all'}
                adults: {type: integer, minimum: 1, maximum: 6, default: 1}
                children: {type: integer, minimum: 0, maximum: 8, default: 0}
                takafulOnly: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      quotes: {type: array, items: {$ref: '#/components/schemas/TravelQuote'}}
        '400': {$ref: '#/components/responses/Error'}
        '422':
          description: INVALID_REQUEST, INVALID_DATES, TRIP_TOO_LONG, INVALID_TRAVELLERS
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /insurance/home-quotes:
    post:
      summary: |
        Home insurance comparison (building and/or contents, one year), cheapest first (⚠️ demo insurers).
        With a propertyId the listing's type is used, and when no sums are sent they are suggested from the listing.
        `input` echoes what was priced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyType: {enum: [villa, apartment, townhouse, office], description: Required without propertyId. Land is not insurable.}
                buildingSumInsuredFils: {type: integer, description: '0, or 10,000,000 to 2,000,000,000 fils'}
                contentsSumInsuredFils: {type: integer, description: '0, or 1,000,000 to 250,000,000 fils (not both 0)'}
                propertyId: {type: string, description: Optional link to a property listing}
                takafulOnly: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      input: {$ref: '#/components/schemas/HomeInput'}
                      quotes: {type: array, items: {$ref: '#/components/schemas/HomeQuote'}}
        '400': {$ref: '#/components/responses/Error'}
        '422':
          description: INVALID_REQUEST, INVALID_SUM_INSURED, PROPERTY_NOT_FOUND, PROPERTY_NOT_INSURABLE
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /policies/quotes:
    post:
      summary: |
        Hold a priced quote from one insurer before checkout (sandbox). The server re-prices it; the client's price
        is never used. Pay `premiumFils` with POST /payments (purpose insurance_premium, reference = the quote id),
        then POST /policies/confirm in the same session. Quotes belong to the session customer and can be paid for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line, insurerId, input]
              properties:
                line: {enum: [motor, travel, home]}
                insurerId: {type: string}
                input:
                  description: |
                    The same body as the line's quote endpoint (travel-quotes or home-quotes). For motor:
                    vehicleValueFils, cover (comprehensive or third-party), agencyRepair and reference (plate or vehicle id).
                  type: object
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/PolicyQuote'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '422':
          description: INVALID_REQUEST, INSURER_NOT_FOUND (does not offer this cover), or a quote rule such as INVALID_DATES
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /policies/confirm:
    post:
      summary: |
        Issue the policy for a paid quote (sandbox). The payment must be CAPTURED, have purpose insurance_premium,
        reference the quote, and match its premium to the fils. Payment and quote must belong to the session customer
        (another session's are 404). Confirming again with the same payment returns the same policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId]
              properties:
                paymentId: {type: string}
                quoteId: {type: string, description: Optional; must equal the payment's reference}
      responses:
        '200': {description: Policy issued, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Policy'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404':
          description: PAYMENT_NOT_FOUND or QUOTE_NOT_FOUND
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: PAYMENT_NOT_CAPTURED, or ALREADY_BOUND (the quote was bound to another payment)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '410':
          description: QUOTE_EXPIRED (paid after the quote expired)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: AMOUNT_MISMATCH, or PAYMENT_MISMATCH (wrong purpose or reference)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/policies:
    get:
      summary: The session customer's insurance policies, active first (sandbox store in memory, plus one expired demo policy)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Policy'}}
                      total: {type: integer}
  /config:
    get:
      summary: Product rules the apps build screens from (consent period, calculator ranges, steps and defaults, personal finance range for this customer)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/ClientConfig'}}}}}}
  /me/cards/{id}:
    get:
      summary: One of the session customer's virtual cards. Another customer's card is 404
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/VirtualCard'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /backoffice/session:
    get:
      summary: The signed-in staff member and role (back office). 401 UNAUTHENTICATED when not signed in
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/StaffSession'}}}}}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      summary: |
        ⚠️ Sandbox staff sign-in: pick a role. Sets the HttpOnly, SameSite=Strict cookie `sahel_staff` and records
        STAFF_SIGNED_IN in the audit log. Production replaces this with staff SSO (role from the token claims).
        API clients may send the `X-Sahel-Staff-Role` header on each request instead of the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/StaffRole'}
      responses:
        '200': {description: Signed in, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/StaffSession'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      summary: Sign out of the back office (clears the cookie)
      responses:
        '200': {description: Signed out}
  /backoffice/dashboard:
    get:
      summary: Back-office KPIs (aggregates only, no personal data). Every staff role
      parameters: [$ref: '#/components/parameters/StaffRoleHeader']
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/BackOfficeKpis'}}}}}}
        '401': {$ref: '#/components/responses/Error'}
  /backoffice/applications:
    get:
      summary: |
        Credit review queue: REFERRED applications of every customer, oldest referral first. Credit officer and
        compliance. Data minimization: first name and masked CPR only; salary and obligations (`financials`) only
        for the credit officer.
      parameters: [$ref: '#/components/parameters/StaffRoleHeader']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/ReferredApplication'}}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: FORBIDDEN (operations), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /backoffice/applications/{id}/decision:
    post:
      summary: |
        A credit officer approves or declines a REFERRED application (REFERRED → APPROVED / DECLINED) with a
        mandatory note, recorded in the audit log (who, role, when, note). The note is internal: the customer sees
        the new status and "Reviewed by credit officer" (`review`, timeline `by`). Repeating the same decision
        returns the original result (`replayed: true`, no new audit entry).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/StaffRoleHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome: {enum: [APPROVED, DECLINED]}
                note: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      application: {$ref: '#/components/schemas/FinanceApplication'}
                      audit: {$ref: '#/components/schemas/AuditEntry'}
                      replayed: {type: boolean}
        '400': {description: 'INVALID_REQUEST (outcome), BAD_JSON', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: FORBIDDEN (not a credit officer), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: APPLICATION_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: NOT_REFERRED (already decided differently or never referred), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: NOTE_REQUIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /backoffice/refunds:
    get:
      summary: |
        Refund queue: CAPTURED `insurance_premium` payments with no policy (quote expired, paid twice, never
        confirmed), older than the minimum age (⚠️ sandbox: 0 minutes). Payment data only. Operations and compliance.
      parameters: [$ref: '#/components/parameters/StaffRoleHeader']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/RefundCandidate'}}
                      total: {type: integer}
                      totalFils: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: FORBIDDEN (credit officer), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /backoffice/refunds/{paymentId}:
    post:
      summary: |
        Operations refunds a captured premium that has no policy (CAPTURED → REFUNDED; ⚠️ sandbox: no money moves),
        with an audit entry. Re-checks the policy binding first. Idempotent: refunding again returns the original
        refund and audit entry (`replayed: true`). A refunded premium can no longer be bound to a policy.
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/StaffRoleHeader'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payment: {type: object}
                      audit: {$ref: '#/components/schemas/AuditEntry'}
                      replayed: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: FORBIDDEN (not operations), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: PAYMENT_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'POLICY_BOUND, NOT_REFUNDABLE (not a premium, not captured, too recent)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /backoffice/audit:
    get:
      summary: Audit log of back-office actions, newest first (compliance viewer, read-only)
      parameters:
        - {name: type, in: query, schema: {$ref: '#/components/schemas/AuditType'}}
        - {$ref: '#/components/parameters/StaffRoleHeader'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
                      total: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: FORBIDDEN (not compliance), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /assistant/messages:
    post:
      summary: |
        Suhail & Suhaila 2.0 (⚠️ sandbox: rules-based, no language model). One customer message in English or Arabic
        (Bahraini / Gulf phrasings and Arabic-Indic digits understood); the reply is in the language of the message.
        Answers come from the session customer's own data (contracts, settlement quotes, pre-approval, policies, cards)
        and the car catalog. Suggested actions are links (checkout, listing, account) that the customer confirms in the
        normal UI: the assistant never pays, signs or applies. The last 10 turns are kept in memory per session
        (customer text PII-redacted); replies never contain the CPR or the salary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, locale]
              properties:
                text: {type: string, maxLength: 500, description: 'The message, 1 to 500 characters'}
                locale: {enum: [en, ar], description: 'App language, used when the text has no letters'}
                persona: {enum: [suhail, suhaila], default: suhaila, description: 'Changes only the name and greeting'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/AssistantReply'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: 'PAYLOAD_TOO_LARGE (body over 8 KiB, refused before it is parsed)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'TEXT_REQUIRED, TEXT_TOO_LONG (over 500 characters), INVALID_REQUEST (locale or persona)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429':
          description: RATE_LIMITED (more than 20 messages a minute in this session)
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds to wait}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /payments/price:
    get:
      summary: The server amount for a server-priced payment. Checkout pages show and pay it; POST /payments refuses any other amount
      parameters:
        - {name: purpose, in: query, required: true, schema: {enum: [reservation_deposit, valuation_fee]}}
        - {name: reference, in: query, required: true, schema: {type: string}, description: 'Vehicle id (reservation_deposit) or property id for sale (valuation_fee)'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purpose: {enum: [reservation_deposit, valuation_fee]}
                      reference: {type: string}
                      amountFils: {type: integer}
                      currency: {const: BHD}
                      pendingApproval: {const: true, description: ⚠️ Placeholder amount pending business sign-off}
        '400': {description: 'INVALID_REQUEST (missing purpose or reference)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'UNKNOWN_REFERENCE (no such vehicle, or no such property for sale)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'NOT_SERVER_PRICED (other purposes: premiums and settlements are priced by their quotes)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /trade-in/valuations:
    post:
      summary: |
        Instant trade-in valuation (⚠️ sandbox: a deterministic rules model, not AI). Values the car from make, model,
        year, mileage, condition grade and accident history: reference price for the model year (demo table derived
        from the catalog), then age, mileage, condition, accident and dealer-margin steps (all in `breakdown`).
        Returns a range (low / high, BHD 100 grid) and makes the low end the session customer's guaranteed instant
        offer, valid through the 7th Bahrain calendar day after today. Replaces the session's previous offer.
        With `garageVehicleId` make, model, year, mileage and plate default to that My Garage car.
        The plate is validated and only ever returned (or kept) masked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condition]
              properties:
                make: {type: string, description: 'Required unless garageVehicleId is given. Matched ignoring case, spaces and dashes'}
                model: {type: string}
                year: {type: integer, description: 'Model year, GET /config tradeIn.minYear to maxYear (and not before the model was sold)'}
                mileageKm: {type: integer, minimum: 0, maximum: 500000}
                condition: {enum: [excellent, good, fair, poor]}
                accidentHistory: {type: boolean, default: false}
                plate: {type: string, description: 'Optional Bahrain private plate, 1 to 6 digits (spaces ignored)'}
                garageVehicleId: {type: string, description: "A car in the customer's My Garage (GET /config tradeIn.garage)"}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/TradeInOffer'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: GARAGE_VEHICLE_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422':
          description: 'UNKNOWN_MAKE or UNKNOWN_MODEL (with `error.suggestions`: close makes or models), YEAR_OUT_OF_RANGE, MILEAGE_OUT_OF_RANGE, INVALID_CONDITION, INVALID_PLATE, INVALID_REQUEST'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: {type: string}
                      message: {type: string}
                      suggestions: {type: array, items: {type: string}}
  /me/trade-in:
    get:
      summary: |
        The session customer's active trade-in offer (`offer` is null when there is none or it expired; another
        session never sees it). With `vehicleId`, `forVehicle` is the down payment the offer gives that car:
        min(offer, maximum down payment) on the calculator step, never below the minimum (cash top-up). ⚠️ Sandbox:
        the trade-in is credited at delivery.
      parameters: [{name: vehicleId, in: query, required: false, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      offer: {oneOf: [$ref: '#/components/schemas/TradeInOffer', type: 'null']}
                      forVehicle: {oneOf: [$ref: '#/components/schemas/TradeInApplication', type: 'null']}
        '404': {description: 'NOT_FOUND (unknown vehicleId)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      summary: Withdraw the active trade-in offer (idempotent; `withdrawn` is false when there was none)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {withdrawn: {type: boolean}}}}}}}}
  /me/rewards:
    get:
      summary: |
        The session customer's IMTIAZ points (⚠️ sandbox: every rate, bonus and threshold is a placeholder). Derived on
        every read from what the customer already has (never written by the payment flow): the opening balance (the
        demo `rewardsPoints` on GET /me), captured payments by purpose (installments on time earn the most, and only a payment that covers the scheduled
        installment counts, never one made after the contract was settled;  a premium
        only once it issued a policy; deposits and valuation fees once per reference; early settlement earns nothing),
        a welcome bonus on the first card, an autopay bonus per contract, good-payer streak bonuses from consecutive
        on-time installments, reversals for refunded payments, and redemptions. The tier is from the points earned in the
        last 12 months (Bahrain dates; not the opening balance or redemptions).
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/RewardsSummary'}}}}}}
  /rewards/catalogue:
    get:
      summary: |
        What IMTIAZ points can be redeemed for (⚠️ placeholder costs; `demoPartner` items are fictional or have no
        partner agreement). `affordable` and `balance` are for the session customer.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      balance: {type: integer}
                      items: {type: array, items: {$ref: '#/components/schemas/RewardItem'}}
  /me/rewards/redemptions:
    get:
      summary: "The session customer's vouchers, newest first. Codes are masked (only the last 4 characters); another session never sees them"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/RewardRedemption'}}
                      total: {type: integer}
    post:
      summary: |
        Redeem a catalogue item for a voucher code (⚠️ sandbox: the voucher has no real value). The response is the only
        place the full `code` appears. "BHD 10 off your next installment" only issues a credit voucher; no payment or
        contract changes. Idempotent per customer: the same Idempotency-Key returns the original redemption (200,
        `replayed: true`); with another item it is 409.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}, description: 'Or the body field idempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [itemId], properties: {itemId: {type: string}, idempotencyKey: {type: string}}}}}
      responses:
        '201':
          description: Redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      redemption: {$ref: '#/components/schemas/RewardRedemption'}
                      balance: {type: integer, description: Balance after the redemption}
                      replayed: {type: boolean}
        '200': {description: 'Replayed (same Idempotency-Key): the original redemption', content: {application/json: {schema: {type: object}}}}
        '400': {description: 'BAD_JSON, or INVALID_REQUEST (missing Idempotency-Key or itemId)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: ITEM_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: 'PAYLOAD_TOO_LARGE (body over 4 KiB)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'IDEMPOTENCY_KEY_REUSED (the key was used for another item)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: INSUFFICIENT_POINTS, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: TOO_MANY_REDEMPTIONS (sandbox cap per customer), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /claims:
    post:
      summary: |
        ⚠️ Sandbox motor claim (First Notice of Loss, J6) for one of the session customer's ACTIVE motor policies.
        Another customer's policy is 404. The incident must not be in the future, must fall inside the policy period
        (Bahrain dates, not before the policy was issued) and be at most `claims.maxDaysSinceIncident` days ago.
        Photos are validated (count, size, JPEG / PNG / WebP by magic bytes) and then DISCARDED: only type and size are
        kept (no file storage in the sandbox). The damage estimate is a fixed rules table by type and severity, NOT AI.
        Form limits come from GET /config (`claims`).
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}, description: 'Optional; repeating it returns the original claim'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyId, incidentAt, location, type, severity, description, thirdPartyInvolved]
              properties:
                policyId: {type: string}
                incidentAt: {type: string, description: 'ISO date-time. With Z or an offset it is an instant; without one it is Bahrain local time (e.g. 2026-10-03T14:30)'}
                location: {type: string, minLength: 3, maxLength: 200}
                latitude: {type: number, description: 'Optional; send with longitude'}
                longitude: {type: number}
                type: {$ref: '#/components/schemas/ClaimType'}
                severity: {enum: [minor, moderate, severe]}
                description: {type: string, minLength: 10, maxLength: 1000}
                policeReportNumber: {type: string, description: 'Required for theft; 3 to 30 letters, digits, / or -'}
                thirdPartyInvolved: {type: boolean}
                photos:
                  type: array
                  maxItems: 6
                  description: 'At least one, except for theft. Each at most 400,000 bytes after client-side compression'
                  items:
                    type: object
                    required: [dataBase64]
                    properties:
                      mimeType: {enum: [image/jpeg, image/png, image/webp], description: Optional; must match the bytes}
                      dataBase64: {type: string, description: 'Base64 bytes, or a data: URL'}
      responses:
        '201': {description: Filed (SUBMITTED), content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Claim'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "POLICY_NOT_FOUND (unknown or another customer's)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: 'PHOTO_TOO_LARGE, or BODY_TOO_LARGE', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422':
          description: |
            INVALID_REQUEST, NOT_MOTOR_POLICY, POLICY_NOT_ACTIVE, NOT_COVERED (third-party cover), INVALID_INCIDENT_TIME,
            INCIDENT_IN_FUTURE, INCIDENT_OUTSIDE_POLICY, INCIDENT_TOO_OLD, INVALID_LOCATION, INVALID_DESCRIPTION,
            POLICE_REPORT_REQUIRED, INVALID_POLICE_REPORT, PHOTOS_REQUIRED, TOO_MANY_PHOTOS, PHOTO_INVALID
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429': {description: TOO_MANY_CLAIMS (sandbox cap per customer), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/claims:
    get:
      summary: The session customer's motor claims, newest first (sandbox store in memory)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Claim'}}
                      total: {type: integer}
  /claims/{id}:
    get:
      summary: "One of the session customer's claims: status timeline, estimate, garage options, replacement car. Another customer's claim is 404"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Claim'}}}}}}
        '404': {description: CLAIM_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /claims/{id}/garage:
    post:
      summary: |
        Book one of the claim's `garageOptions` (APPROVED → REPAIR_BOOKED). Agency garages only when the policy has
        agency repair. A total loss has nothing to repair (409 NO_REPAIR_NEEDED). Another customer's claim is 404.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [garageId], properties: {garageId: {type: string}}}}}
      responses:
        '200': {description: Booked, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Claim'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: CLAIM_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'INVALID_TRANSITION (not APPROVED), or NO_REPAIR_NEEDED', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'INVALID_REQUEST, GARAGE_NOT_FOUND, or GARAGE_NOT_ALLOWED (agency garage without agency repair)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /claims/{id}/advance:
    post:
      summary: |
        ⚠️ SANDBOX ONLY, to demo assessment: stands in for the insurer's claims handler. Moves the session customer's
        claim to `to`, or to the next happy-path status (UNDER_ASSESSMENT, APPROVED, then SETTLED once repaired or for a
        total loss). Transitions follow the enforced status machine; REPAIR_BOOKED needs POST /claims/{id}/garage.
        Not part of the production API.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {to: {$ref: '#/components/schemas/ClaimStatus'}}}}}
      responses:
        '200': {description: Moved, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Claim'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: CLAIM_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: INVALID_TRANSITION, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: INVALID_REQUEST (unknown status), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/notifications:
    get:
      summary: |
        ⚠️ Sandbox notifications inbox of the session customer, DERIVED on every read (nothing is stored but read /
        dismissed ids and preferences): installment due in 0..3 Bahrain days or overdue, autopay off, early settlement
        completed, My Garage registration and motor insurance ending in 30 days, policies ending in 30 days or ended,
        claim status changes, application decisions and next actions, cards issued, trade-in offer ending in 2 days,
        pre-approval and consent ending in 7 days. Ids are stable (type, entity, period) so read and dismissed state
        survives. Dismissed items are left out. Sorted by group (today, this week, earlier; Bahrain days), priority,
        newest first. `delivery` says which channels it WOULD go out on (nothing is sent).
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NotificationInbox'}}}}}}
  /me/notifications/unread-count:
    get:
      summary: |
        Unread count for the web header bell. Unlike the other /me routes it never STARTS a session: without one it
        answers for a fresh demo customer (like server-rendered pages), so polling it on page load cannot race a
        request that is starting the browser's session. Apps with a session use GET /me/notifications.
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {unreadCount: {type: integer}, total: {type: integer}}}}}}}}
  /me/notifications/{id}/read:
    post:
      summary: "Mark one of the session customer's current notifications read (idempotent). Returns the inbox"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NotificationInbox'}}}}}}
        '404': {description: 'NOTIFICATION_NOT_FOUND (unknown, malformed, or another customer''s id)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/notifications/read-all:
    post:
      summary: Mark every current notification of the session customer read. Returns the inbox (unreadCount 0)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NotificationInbox'}}}}}}
  /me/notifications/{id}/dismiss:
    post:
      summary: |
        Remove one notification from the inbox. It stays dismissed when derived again; a new period (next installment,
        new claim status, new expiry date) is a new id. A mandatory notice (overdue payment) cannot be dismissed
        (422 MANDATORY_CATEGORY). Returns the inbox
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NotificationInbox'}}}}}}
        '404': {description: NOTIFICATION_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'MANDATORY_CATEGORY (an overdue-payment notice is required and stays in the inbox)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/notification-preferences:
    get:
      summary: "The session customer's channel switches per category, mandatory categories and quiet hours (Asia/Bahrain). Defaults until changed"
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NotificationPreferences'}}}}}}
    put:
      summary: |
        Change some channel switches and / or quiet hours (every field optional; returns the full preferences).
        A mandatory category (overdue payments; ⚠️ CBB consumer-protection placeholder) must keep at least one channel.
        ⚠️ Sandbox: in memory, nothing is ever sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categories:
                  type: array
                  items:
                    type: object
                    required: [category, channels]
                    properties:
                      category: {$ref: '#/components/schemas/NotificationCategory'}
                      channels: {$ref: '#/components/schemas/NotificationChannelSwitches'}
                quietHours:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
                    end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/NotificationPreferences'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: 'PAYLOAD_TOO_LARGE (body over 16 KiB)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'INVALID_REQUEST (unknown category or channel, non-boolean, bad time), or MANDATORY_CATEGORY', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /requests:
    post:
      summary: |
        "Bid For Me" (crazy idea #1, ⚠️ sandbox): the session customer posts what they want (criteria) and how they want
        to pay; partner dealers bid for 72 hours (`expiresAt`). The maximum monthly must fit the customer's DBR headroom
        (their pre-approval's maximum monthly installment): above it the request is REJECTED with 422 OVER_BUDGET (not
        posted with a flag), so dealers never compete on offers BCFC could not finance. One open request per customer.
        The response carries system `instantMatches`: catalogue cars that match and fit, priced with the shared engine
        on the customer's terms, cheapest monthly first. Options and limits come from GET /config `bids`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxMonthlyFils, structure, tenureMonths]
              properties:
                bodyType: {enum: [any, sedan, suv, hatchback, pickup, coupe], default: any}
                condition: {enum: [any, new, used], default: any}
                minYear: {type: [integer, 'null'], description: 'Oldest model year (GET /config bids.minYear to maxYear); null for any'}
                maxMileageKm: {type: [integer, 'null'], minimum: 0, maximum: 500000}
                fuel: {enum: [any, petrol, hybrid, electric], default: any}
                minSeats: {type: [integer, 'null'], description: 'One of bids.seatOptions; null for any'}
                maxMonthlyFils: {type: integer, description: 'At least bids.minMonthlyFils and at most the DBR headroom (bids.maxMonthlyFils)'}
                structure: {enum: [conventional, murabaha]}
                tenureMonths: {type: integer, description: 'Vehicle tenure range (12 to 84)'}
                downPaymentFils: {type: integer, minimum: 0, default: 0, description: Cash part of the down payment}
                useTradeIn: {type: boolean, default: false, description: "Add the session's active trade-in offer to the down payment"}
                insurance: {enum: [takaful, any, none], default: takaful, description: 'Motor insurance estimate on each offer: Takaful only, any insurer, or none'}
      responses:
        '201': {description: Posted (OPEN), content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/BidRequest'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: REQUEST_ALREADY_OPEN, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'INVALID_REQUEST, OVER_BUDGET (above the DBR headroom), or NO_TRADE_IN (useTradeIn without an active offer)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: TOO_MANY_REQUESTS (sandbox cap per customer), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/requests:
    get:
      summary: "The session customer's Bid For Me requests, newest first (`open` is the id of the open one, if any)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/BidRequest'}}
                      total: {type: integer}
                      open: {type: [string, 'null']}
  /requests/{id}:
    get:
      summary: |
        One of the session customer's requests: criteria, terms, instant matches and the dealer bids ranked by `sort`
        (live bids first, lost bids last). The apps poll it every `pollSeconds` while it is OPEN. Another customer's
        request is 404. An OPEN request past `expiresAt` reads as EXPIRED (its bids LOST).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: sort, in: query, required: false, schema: {enum: [monthly, total, extras], default: monthly}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/BidRequest'}}}}}}
        '404': {description: REQUEST_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /requests/{id}/accept:
    post:
      summary: |
        Accept a live bid: the request is CLOSED, the bid ACCEPTED and every other bid LOST. The dealer gets a lead
        (source `bid`, first name and initial only) on its leads board. `accepted.applyHref` is the car page, where the
        customer applies for finance with the accepted bid (`?requestId=&bidId=`): POST /applications prices it at the bid's
        discounted price and records the extras. The lead carries the list price, the bid price and the extras.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [bidId], properties: {bidId: {type: string}}}}}
      responses:
        '200': {description: Accepted, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/BidRequest'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'REQUEST_NOT_FOUND, or BID_NOT_FOUND (unknown, replaced by a newer bid from the same dealer, or not live)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: REQUEST_CLOSED (accepted or cancelled), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: REQUEST_EXPIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: INVALID_REQUEST (missing bidId), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /requests/{id}/cancel:
    post:
      summary: "Cancel an open request (CANCELLED; its live bids are LOST). Another customer's request is 404"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/BidRequest'}}}}}}
        '404': {description: REQUEST_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: REQUEST_CLOSED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: REQUEST_EXPIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dealer/{sellerId}/requests:
    get:
      summary: |
        Dealer portal (⚠️ sandbox, no staff login): open Bid For Me requests that at least one car of this dealer
        matches (or that it already bid on), newest first. Data minimization: the criteria, the terms needed to price a
        car, the customer's first name and whether they are pre-approved for the budget. Never the customer id, salary,
        CPR, obligations, exact headroom, trade-in or other dealers' bids (only `bidCount`).
      parameters: [{name: sellerId, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/DealerBidRequest'}}
                      total: {type: integer}
        '404': {description: UNKNOWN_DEALER, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dealer/{sellerId}/requests/{id}/bids:
    post:
      summary: |
        Bid a car from this dealer's stock on an open request, with an optional discount (capped at the lower of
        `bids.maxDiscountFils` and `bids.maxDiscountPct` of the price) and extras from the fixed list (one free-service
        plan at most). The server prices the monthly with the shared engine on the customer's structure, tenure and down
        payment and the discounted price; any monthly the client sends is ignored. One bid per dealer: a new bid
        replaces the previous one (with a new id). Returns the request as this dealer sees it, with `myBid`.
      parameters:
        - {name: sellerId, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId]
              properties:
                vehicleId: {type: string}
                discountFils: {type: integer, minimum: 0, default: 0}
                extras: {type: array, items: {$ref: '#/components/schemas/BidExtra'}}
      responses:
        '201': {description: Bid placed, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/DealerBidRequest'}}}}}}
        '400': {description: BAD_JSON, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'UNKNOWN_DEALER, REQUEST_NOT_FOUND, or VEHICLE_NOT_FOUND', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: REQUEST_CLOSED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: REQUEST_EXPIRED, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422':
          description: |
            INVALID_REQUEST, VEHICLE_NOT_IN_INVENTORY (another dealer's car), CRITERIA_MISMATCH, INVALID_DISCOUNT,
            DISCOUNT_TOO_HIGH, INVALID_EXTRAS, DOWN_PAYMENT_TOO_LOW (the customer's down payment is below the car's
            minimum), OVER_MAX_MONTHLY (above the customer's maximum monthly)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
components:
  parameters:
    StaffRoleHeader:
      name: X-Sahel-Staff-Role
      in: header
      required: false
      description: ⚠️ Sandbox back-office role, instead of the `sahel_staff` cookie. Production uses staff SSO.
      schema: {$ref: '#/components/schemas/StaffRole'}
    SellerId:
      name: sellerId
      in: path
      required: true
      description: Dealer (nmc, tac, demo-dealer). ⚠️ Sandbox has no staff login.
      schema: {type: string}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
    Localized:
      type: object
      required: [en, ar]
      properties: {en: {type: string}, ar: {type: string}}
    FinanceStructure:
      enum: [conventional, murabaha, ijara]
    VehicleListing:
      type: object
      properties:
        id: {type: string}
        make: {type: string}
        model: {type: string}
        trim: {type: string}
        year: {type: integer}
        condition: {enum: [new, used]}
        mileageKm: {type: integer}
        priceFils: {type: integer}
        bodyType: {type: string}
        fuel: {type: string}
        seats: {type: integer}
        color: {$ref: '#/components/schemas/Localized'}
        seller: {type: object}
        inspected: {type: boolean}
        accentHue: {type: integer}
        fromMonthlyFils: {type: integer}
    PropertyListing:
      type: object
      properties:
        id: {type: string}
        title: {$ref: '#/components/schemas/Localized'}
        area: {$ref: '#/components/schemas/Localized'}
        type: {type: string}
        purpose: {enum: [sale, rent]}
        priceFils: {type: integer, description: 'Sale price, or monthly rent when purpose is rent'}
        bedrooms: {type: integer}
        bathrooms: {type: integer}
        sizeSqm: {type: integer}
        valued: {type: boolean}
        fromMonthlyFils: {type: integer}
    FinanceQuote:
      type: object
      properties:
        structure: {$ref: '#/components/schemas/FinanceStructure'}
        financedFils: {type: integer}
        tenureMonths: {type: integer}
        monthlyFils: {type: integer}
        finalInstallmentFils: {type: integer}
        totalPayableFils: {type: integer}
        costOfFinanceFils: {type: integer, description: Interest (conventional) or profit (Islamic)}
        ratePct: {type: number}
        rateBasis: {enum: [apr, flat, profit]}
        aprPct: {type: number, description: 'APR computed from cash flows, comparable across structures'}
        salePriceFils: {type: integer, description: Murabaha only}
    FinanceLimits:
      type: object
      properties:
        minTenureMonths: {type: integer}
        maxTenureMonths: {type: integer}
        minDownPaymentFils: {type: integer}
        maxDownPaymentFils: {type: integer}
        structures: {type: array, items: {$ref: '#/components/schemas/FinanceStructure'}}
        downPaymentStepFils: {type: integer, description: Down payment slider step}
        tenureStepMonths: {type: integer, description: Tenure slider step}
        defaultDownPaymentFils: {type: integer, description: 'Listing default, rounded to a step, never below the minimum'}
        defaultTenureMonths: {type: integer}
    PreApprovalShare:
      type: object
      properties:
        token: {type: string, description: 'Random and opaque, formatted XXXX-XXXX (Crockford base32)'}
        expiresAt: {type: string, format: date-time}
        ttlSeconds: {type: integer}
    SharedPreApproval:
      type: object
      description: Everything a dealer learns from a token (data minimization; no salary, CPR or obligations).
      properties:
        firstName: {$ref: '#/components/schemas/Localized'}
        vehicleLimitFils: {type: integer}
        maxMonthlyFils: {type: integer}
        validUntil: {type: string, format: date, description: Pre-approval validity}
        tokenExpiresAt: {type: string, format: date-time}
    LeadStatus:
      enum: [NEW, CONTACTED, TEST_DRIVE, OFFER_SENT, WON, LOST]
    Lead:
      type: object
      properties:
        id: {type: string}
        sellerId: {type: string}
        vehicleId: {type: string}
        vehicleTitle: {type: string}
        customerName: {$ref: '#/components/schemas/Localized'}
        source: {enum: [reserved, applied, viewed, bid], description: 'bid: an accepted Bid For Me bid'}
        status: {$ref: '#/components/schemas/LeadStatus'}
        preApproved: {type: boolean}
        bid:
          type: object
          description: 'Source bid only: what the lead was won at (list price versus the dealer''s bid price)'
          properties:
            listPriceFils: {type: integer}
            priceFils: {type: integer, description: Price after the dealer's discount}
            discountFils: {type: integer}
            extras: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConsentScope:
      enum: [CRB, OPEN_BANKING]
    EKeyIdentity:
      type: object
      properties:
        provider: {const: ekey-sandbox}
        verified: {type: boolean}
        name: {$ref: '#/components/schemas/Localized'}
        cprMasked: {type: string, example: '******345', description: Last 3 digits only}
        nationality: {$ref: '#/components/schemas/Localized'}
        verifiedAt: {type: string, format: date-time}
    ConsentRecord:
      type: object
      properties:
        scopes: {type: array, items: {$ref: '#/components/schemas/ConsentScope'}}
        grantedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: grantedAt + 90 days}
    PreApproval:
      type: object
      properties:
        maxMonthlyFils: {type: integer}
        limits:
          type: array
          items:
            type: object
            properties:
              productLine: {enum: [vehicle, personal, home]}
              maxFinanceFils: {type: integer}
              maxMonthlyFils: {type: integer}
              tenureMonths: {type: integer}
        cardLimitFils: {type: integer}
        validUntil: {type: string, format: date}
    OnboardingPreApproval:
      type: object
      properties:
        preApproval: {$ref: '#/components/schemas/PreApproval'}
        consent: {$ref: '#/components/schemas/ConsentRecord'}
        employer: {type: string}
        sandbox: {const: true}
    VirtualCard:
      type: object
      description: Display record only. A full PAN or CVV is never generated or returned.
      properties:
        id: {type: string}
        cardId: {type: string}
        name: {$ref: '#/components/schemas/Localized'}
        network: {const: mastercard}
        panMasked: {type: string, example: 5xxx xxxx xxxx 1234}
        last4: {type: string, pattern: '^\d{4}$'}
        expiry: {type: string, example: 10/29, description: MM/YY}
        status: {enum: [ACTIVE, FROZEN, CLOSED]}
        limitFils: {type: integer, description: 0 for prepaid}
        issuedAt: {type: string, format: date-time}
        gradient: {type: array, items: {type: string}}
        wallet:
          type: object
          description: Push-provisioning availability (sandbox, simulated)
          properties:
            applePay: {type: boolean}
            googlePay: {type: boolean}
            samsungPay: {type: boolean}
            sandbox: {const: true}
    CardApplication:
      type: object
      required: [decision, cardId]
      properties:
        decision: {enum: [APPROVED, DECLINED]}
        cardId: {type: string}
        limitFils: {type: integer, description: APPROVED only}
        virtualCard: {$ref: '#/components/schemas/VirtualCard'}
        reason: {enum: [BELOW_MIN_SALARY, NO_DBR_HEADROOM], description: DECLINED only}
    ApplicationStatus:
      enum: [DRAFT, SUBMITTED, APPROVED, REFERRED, DECLINED, OFFER_ACCEPTED, CONTRACT_SIGNED, ASSET_PURCHASED_BY_BCFC, OWNERSHIP_TRANSFERRED_TO_BCFC, SALE_TO_CUSTOMER, VALUATION_CONFIRMED, 
            LEASE_STARTED, OWNERSHIP_TRANSFERRED_TO_CUSTOMER, DISBURSED, COMPLETED]
    Decision:
      type: object
      description: ⚠️ Placeholder credit policy (sandbox) until BCFC Credit Risk rules and CRB data are integrated.
      properties:
        outcome: {enum: [APPROVED, REFERRED, DECLINED]}
        reasons:
          type: array
          description: OK, or every failing rule (most severe first). DBR_EXCEEDED declines; AMOUNT_ABOVE_PREAPPROVAL and HIGH_DBR_UTILISATION refer to a credit officer.
          items: {enum: [OK, DBR_EXCEEDED, AMOUNT_ABOVE_PREAPPROVAL, HIGH_DBR_UTILISATION]}
        monthlyFils: {type: integer, description: New installment applied for}
        maxMonthlyFils: {type: integer, description: Headroom under the DBR cap before this application}
        dbrCapPct: {type: number}
        dbrAfterPct: {type: [number, 'null']}
        preApprovedLimitFils: {type: integer}
    FinanceApplication:
      type: object
      properties:
        id: {type: string}
        customerId: {type: string}
        productLine: {enum: [vehicle, personal, home]}
        structure: {enum: [conventional, murabaha, ijara]}
        quote: {$ref: '#/components/schemas/FinanceQuote'}
        reference: {type: string, description: 'Vehicle id for cars, property id for home finance, "personal" for personal finance'}
        applicant:
          type: object
          properties:
            monthlySalaryFils: {type: integer}
            existingObligationsFils: {type: integer}
        status: {$ref: '#/components/schemas/ApplicationStatus'}
        decision: {$ref: '#/components/schemas/Decision'}
        timeline:
          type: array
          description: What happened, oldest first
          items:
            type: object
            properties:
              status: {$ref: '#/components/schemas/ApplicationStatus'}
              at: {type: string, format: date-time}
              by: {enum: [CREDIT_OFFICER], description: Present when a credit officer made this step}
        review: {$ref: '#/components/schemas/CreditReview'}
        steps:
          type: array
          description: Timeline to render (done steps with timestamps, then steps still to come). Clients render it as-is.
          items:
            type: object
            properties:
              status: {$ref: '#/components/schemas/ApplicationStatus'}
              at: {type: string, format: date-time, description: Absent for steps still to come}
              done: {type: boolean}
              murabaha: {type: boolean, description: Part of the Murabaha buy / own / sell sequence}
              by: {enum: [CREDIT_OFFICER], description: 'Present when a credit officer decided this step ("Reviewed by credit officer")'}
              ijara: {type: boolean, description: 'Part of the Ijara Muntahia Bittamleek sequence (BCFC buys, leases, then ownership passes after the final rental)'}
        idempotencyKey: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        nextAction:
          type: object
          description: 'What the customer must do before fulfilment continues (absent when nothing). Conventional home finance at CONTRACT_SIGNED: pay the valuation fee (amount from GET /payments/price),
            then accept again.'
          properties:
            type: {const: PAY_VALUATION_FEE}
            purpose: {const: valuation_fee}
            reference: {type: string, description: The property id}
            feePaid: {type: boolean, description: 'True once this customer has a captured valuation fee for the property: clients show "Continue" (accept again) instead of "Pay valuation fee"'}
        valuationPaymentId: {type: string, description: 'Conventional home finance: the captured valuation-fee payment that confirmed the valuation'}
        source:
          type: object
          description: 'Vehicle only: the accepted Bid For Me bid the application is priced from (re-validated by the server)'
          properties:
            type: {const: bid}
            requestId: {type: string}
            bidId: {type: string}
        tradeIn:
          type: object
          description: 'Vehicle only: the trade-in counted in the down payment, credited at delivery (sandbox)'
          properties:
            offerId: {type: string}
            offerFils: {type: integer, description: The guaranteed instant offer}
            creditFils: {type: integer, description: Part of the offer counted as down payment (never above the maximum down payment)}
            capped: {type: boolean}
        listPriceFils: {type: integer, description: 'Vehicle with a bid: the catalogue price before the discount (quote.assetPriceFils is after it)'}
        extras: {type: array, items: {type: string}, description: 'The accepted bid''s extras (recorded, not financed)'}
        pricing: {$ref: '#/components/schemas/ApplicationPricing'}
    ApplicationPricing:
      type: object
      description: 'How the financed amount is made up, computed on the server (apps only render it). Without a bid or trade-in the list price is the asset price and nothing is discounted or credited.'
      properties:
        listPriceFils: {type: integer}
        discountFils: {type: integer, description: Dealer discount from the accepted bid}
        priceFils: {type: integer, description: Price after the discount (the asset price financed)}
        tradeInCreditFils: {type: integer, description: Trade-in counted as down payment and credited at delivery}
        downPaymentFils: {type: integer, description: Trade-in credit plus cash}
        cashDownPaymentFils: {type: integer}
        extras: {type: array, items: {type: string, enum: [service-1y, service-2y, service-3y, window-tint, extended-warranty, free-registration, floor-mats, full-tank]}}
        financedFils: {type: integer}
    LifeEvent:
      type: object
      properties:
        id: {enum: [married, new-job, first-home, new-baby]}
        icon: {type: string}
        title: {$ref: '#/components/schemas/Localized'}
        subtitle: {$ref: '#/components/schemas/Localized'}
    BundleItem:
      type: object
      properties:
        id: {type: string}
        kind: {enum: [personal-finance, vehicle, home-finance, home-rent-to-own, card, travel, home-cover, life-cover]}
        title: {$ref: '#/components/schemas/Localized'}
        description: {$ref: '#/components/schemas/Localized'}
        href: {type: string, description: 'In-app path without the locale prefix (web: /{locale}{href}; mobile: same route)'}
        productLine: {enum: [vehicle, personal, home]}
        structure: {$ref: '#/components/schemas/FinanceStructure'}
        assetPriceFils: {type: integer}
        downPaymentFils: {type: integer}
        financedFils: {type: integer}
        tenureMonths: {type: integer}
        costOfFinanceFils: {type: integer, description: Interest (conventional) or profit (Islamic)}
        cardId: {type: string}
        annualFeeFils: {type: integer}
        cardLimitFils: {type: integer}
        monthlyFils: {type: integer, description: 'Installment from the pricing engine, or an indicative premium for cover placeholders; 0 when not applicable'}
        countsTowardDbr: {type: boolean}
        placeholder: {type: boolean, description: ⚠️ Not a live product yet}
    LifeEventBundle:
      type: object
      properties:
        event: {$ref: '#/components/schemas/LifeEvent'}
        structure: {enum: [islamic, conventional]}
        items: {type: array, items: {$ref: '#/components/schemas/BundleItem'}}
        totalMonthlyFils: {type: integer, description: Sum of the financed items (what the DBR cap applies to)}
        otherMonthlyFils: {type: integer, description: "Indicative cover premiums, outside the DBR check"}
        maxMonthlyFils: {type: integer, description: DBR headroom}
        headroomAfterFils: {type: integer, description: Negative when over budget}
        verdict: {enum: [fits, over-budget]}
        shortfallFils: {type: integer}
        illustrative: {const: true}
    Contract:
      type: object
      properties:
        id: {type: string}
        title: {$ref: '#/components/schemas/Localized'}
        structure: {$ref: '#/components/schemas/FinanceStructure'}
        quote: {$ref: '#/components/schemas/FinanceQuote'}
        startDate: {type: string, format: date}
        outstandingFils: {type: integer}
        nextInstallment:
          type: object
          properties:
            number: {type: integer}
            dueDate: {type: string, format: date}
            amountFils: {type: integer}
            status: {enum: [paid, due, upcoming, overdue]}
        installmentsPaid: {type: integer}
        autopay: {type: boolean}
        settlement:
          type: object
          description: Present once a captured early-settlement payment closed the contract (⚠️ sandbox, this session only)
          properties:
            paymentId: {type: string}
            amountFils: {type: integer}
            settledAt: {type: string, format: date-time}
            settledOn: {type: string, format: date, description: Bahrain calendar date of settledAt}
    SettlementQuote:
      type: object
      properties:
        contractId: {type: string}
        structure: {$ref: '#/components/schemas/FinanceStructure'}
        installmentsPaid: {type: integer}
        installmentsRemaining: {type: integer}
        remainingScheduledFils: {type: integer, description: Paying every remaining installment to term}
        lines:
          type: array
          items:
            type: object
            properties:
              kind: {enum: [remaining_principal, settlement_fee, remaining_sale_price, ibra_rebate, remaining_asset_cost]}
              amountFils: {type: integer, description: "Negative for deductions (the Ibra' rebate)"}
        settlementAmountFils: {type: integer}
        savingsFils: {type: integer}
        basis: {enum: [remaining-principal, sale-price-less-ibra, remaining-asset-cost]}
        pendingApproval: {const: true, description: "⚠️ Placeholder rule pending the Shari'a board / CBB"}
        validUntil: {type: string, format: date}
        payment:
          type: object
          properties:
            purpose: {const: early_settlement}
            amountFils: {type: integer}
            reference: {type: string}
    TravelRegion:
      description: GCC, worldwide excluding the US and Canada, or worldwide
      enum: [gcc, worldwide-excl-us-ca, worldwide]
    TravelQuote:
      type: object
      properties:
        insurerId: {type: string}
        insurerName: {$ref: '#/components/schemas/Localized'}
        takaful: {type: boolean}
        region: {$ref: '#/components/schemas/TravelRegion'}
        tier: {enum: [basic, plus]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        days: {type: integer, description: Inclusive of both ends}
        adults: {type: integer}
        children: {type: integer}
        premiumFils: {type: integer}
        medicalCoverFils: {type: integer, description: Emergency medical cover per traveller}
        schengenCompliant: {type: boolean}
    HomeInput:
      type: object
      properties:
        propertyType: {enum: [villa, apartment, townhouse, office]}
        buildingSumInsuredFils: {type: integer}
        contentsSumInsuredFils: {type: integer}
        propertyId: {type: string}
        propertyTitle: {$ref: '#/components/schemas/Localized'}
    HomeQuote:
      type: object
      properties:
        insurerId: {type: string}
        insurerName: {$ref: '#/components/schemas/Localized'}
        takaful: {type: boolean}
        propertyType: {enum: [villa, apartment, townhouse, office]}
        propertyId: {type: string}
        buildingSumInsuredFils: {type: integer}
        contentsSumInsuredFils: {type: integer}
        annualPremiumFils: {type: integer}
        accidentalDamage: {type: boolean}
        temporaryAccommodation: {type: boolean}
    PolicyCover:
      type: object
      description: |
        What is covered. motor: cover, vehicleValueFils, agencyRepair, reference. travel: region, tier, adults,
        children, days, medicalCoverFils. home: propertyType, buildingSumInsuredFils, contentsSumInsuredFils,
        propertyId and propertyTitle (when linked to a listing).
      required: [line]
      properties:
        line: {enum: [motor, travel, home]}
    PolicyQuote:
      type: object
      properties:
        id: {type: string, description: 'pq_… (use it as the payment reference)'}
        customerId: {type: string}
        line: {enum: [motor, travel, home]}
        insurerId: {type: string}
        insurerName: {$ref: '#/components/schemas/Localized'}
        takaful: {type: boolean}
        premiumFils: {type: integer}
        cover: {$ref: '#/components/schemas/PolicyCover'}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        policyId: {type: string, description: Set once a policy was issued}
    Policy:
      type: object
      properties:
        id: {type: string}
        policyNumber: {type: string, description: 'Sandbox numbers start with SBX-'}
        customerId: {type: string}
        line: {enum: [motor, travel, home]}
        insurerId: {type: string}
        insurerName: {$ref: '#/components/schemas/Localized'}
        takaful: {type: boolean}
        premiumFils: {type: integer}
        cover: {$ref: '#/components/schemas/PolicyCover'}
        startDate: {type: string, format: date, description: First day covered}
        endDate: {type: string, format: date, description: Last day covered}
        status: {enum: [ACTIVE, EXPIRED], description: EXPIRED after endDate (Bahrain date)}
        quoteId: {type: string}
        paymentId: {type: string}
        issuedAt: {type: string, format: date-time}
    CardOffer:
      description: A card product (fields as in the catalog) plus the session customer's eligibility
      type: object
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/Localized'}
        tier: {type: string}
        network: {const: mastercard}
        annualFeeFils: {type: integer}
        minSalaryFils: {type: integer}
        forHer: {type: boolean}
        gradient: {type: array, items: {type: string}}
        highlights: {type: array, items: {$ref: '#/components/schemas/Localized'}}
        eligible: {type: boolean, description: An instant application would be approved}
        ineligibleReason: {enum: [BELOW_MIN_SALARY, NO_DBR_HEADROOM, null], description: Null when eligible}
        offeredLimitFils: {type: integer, description: 'Limit the card would be issued with (0 for prepaid or when not eligible)'}
    CustomerView:
      type: object
      description: Customer overview. ⚠️ Sandbox session
      properties:
        customerId: {type: string, description: Opaque; never the session id}
        name: {$ref: '#/components/schemas/Localized'}
        monthlySalaryFils: {type: integer}
        existingObligationsFils: {type: integer}
        preApproval: {$ref: '#/components/schemas/PreApproval'}
        contracts: {type: array, items: {$ref: '#/components/schemas/Contract'}}
        garage: {type: array, items: {type: object}}
        rewardsPoints: {type: integer, description: 'Opening IMTIAZ points balance (⚠️ demo); the live balance is GET /me/rewards'}
        onboarded: {type: boolean, description: false while the session is still the demo customer}
        cprMasked: {type: string, description: "From the sandbox eKey login, when done"}
    CalculatorRules:
      type: object
      properties:
        minTenureMonths: {type: integer}
        maxTenureMonths: {type: integer}
        minDownPaymentPct: {type: number}
        defaultDownPaymentPct: {type: number}
        defaultTenureMonths: {type: integer}
        downPaymentStepFils: {type: integer}
        tenureStepMonths: {type: integer}
        structures: {type: array, items: {$ref: '#/components/schemas/FinanceStructure'}}
    PersonalFinanceRange:
      type: object
      properties:
        preApprovedFils: {type: integer, description: The customer's indicative personal finance limit}
        minAmountFils: {type: integer}
        maxAmountFils: {type: integer, description: 'Pre-approved limit rounded down to a step, never below the minimum'}
        defaultAmountFils: {type: integer}
        amountStepFils: {type: integer}
        defaultTenureMonths: {type: integer}
        tenureStepMonths: {type: integer}
        minTenureMonths: {type: integer}
        maxTenureMonths: {type: integer}
    ClientConfig:
      type: object
      properties:
        consent:
          type: object
          properties:
            scopes: {type: array, items: {$ref: '#/components/schemas/ConsentScope'}}
            validityDays: {type: integer}
        finance:
          type: object
          properties:
            vehicle: {$ref: '#/components/schemas/CalculatorRules'}
            personal: {$ref: '#/components/schemas/CalculatorRules'}
            home: {$ref: '#/components/schemas/CalculatorRules'}
        personalFinance: {$ref: '#/components/schemas/PersonalFinanceRange'}
        reservationDepositFils: {type: integer, description: Deposit to reserve a car}
        insurance: {$ref: '#/components/schemas/InsuranceRules'}
        sandbox: {const: true}
        tradeIn: {$ref: '#/components/schemas/TradeInRules'}
        claims: {$ref: '#/components/schemas/ClaimRules'}
        bids: {$ref: '#/components/schemas/BidRules'}
    InsuranceRules:
      type: object
      description: Travel and home insurance form rules and defaults (the quote endpoints still validate every request)
      properties:
        travel:
          type: object
          properties:
            regions: {type: array, items: {$ref: '#/components/schemas/TravelRegion'}}
            tiers: {type: array, items: {enum: [basic, plus]}}
            minAdults: {type: integer}
            maxAdults: {type: integer}
            maxChildren: {type: integer}
            maxTripDays: {type: integer}
            maxDaysAhead: {type: integer, description: "Latest start date, in days from today (Bahrain date)"}
            defaultStartInDays: {type: integer}
            defaultTripDays: {type: integer}
        home:
          type: object
          properties:
            propertyTypes: {type: array, items: {enum: [villa, apartment, townhouse, office]}}
            defaultPropertyType: {enum: [villa, apartment, townhouse, office]}
            defaultBuildingSumInsuredFils: {type: integer}
            defaultContentsSumInsuredFils: {type: integer}
            buildingMinFils: {type: integer}
            buildingMaxFils: {type: integer}
            contentsMinFils: {type: integer}
            contentsMaxFils: {type: integer}
    CreditReview:
      type: object
