name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared files are up to date
        run: npm run gen && git diff --exit-code
      - run: npm test -w @sahel/domain
      - run: npm run typecheck -w @sahel/domain
      - run: npm run typecheck -w @sahel/web
      - run: npm run build -w @sahel/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w @sahel/web

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
